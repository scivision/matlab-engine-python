name: matlab

on:
  push:
    paths:
    - "**.m"
    - "**.cmake"
    - "**/CMakeLists.txt"
    - ".github/workflows/ci-matlab.yml"


jobs:

  unix:

    strategy:
      matrix:
        os: [ubuntu-24.04, macos-latest]
        matlab: [R2024b]
        python-version: ["3.12"]

    runs-on: ${{ matrix.os }}

    steps:

    - name: Install MATLAB
      timeout-minutes: 10
      uses: matlab-actions/setup-matlab@v2
      with:
        release: ${{ matrix.matlab }}
        cache: true

    - name: setup Python
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python-version }}

    - name: Configure Matlab Interface for Python
      run: matlab -batch "pyenv(Version='${{ matrix.python-version }}')"

    - uses: actions/checkout@v4

    - name: Lint task
      uses: matlab-actions/run-build@v2
      with:
        tasks: check

    - name: Test task
      uses: matlab-actions/run-build@v2
      with:
        tasks: test


  msys2:
    runs-on: windows-latest
    timeout-minutes: 10

    strategy:
      matrix:
        matlab: [R2024b]
        python-version: ["3.12"]

    steps:
    - uses: msys2/setup-msys2@v2
      with:
        update: true
        install: >-
          mingw-w64-ucrt-x86_64-gcc-fortran

    - name: Put MSYS2_MinGW64 on PATH
      run: echo "${{ runner.temp }}/msys64/ucrt64/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Install MATLAB
      timeout-minutes: 10
      uses: matlab-actions/setup-matlab@v2
      with:
        release: ${{ matrix.matlab }}
        cache: true

    - name: setup Python
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python-version }}

    - name: Configure Matlab Interface for Python
      run: matlab -batch "pyenv(Version='${{ matrix.python-version }}')"

    - uses: actions/checkout@v4

    - name: Lint task
      uses: matlab-actions/run-build@v2
      with:
        tasks: check

    - name: Test task
      uses: matlab-actions/run-build@v2
      with:
        tasks: test
